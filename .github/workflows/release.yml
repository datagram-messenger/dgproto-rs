name: Release

# Triggered by a semver tag pushed to origin.
# Tags must be created by the release-prep workflow (or manually) and follow
# the pattern v<major>.<minor>.<patch> (e.g. v0.1.0, v1.2.3).
#
# What this workflow does:
#   1. Verifies Cargo.toml version matches the tag.
#   2. Publishes the crate to crates.io.
#   3. Creates a GitHub Release with auto-generated notes.
#
# CI (fmt, clippy, tests, MSRV) is intentionally NOT re-run here — tags are
# only pushed from main which has already passed ci.yml. Re-running CI on the
# tag wastes ~3–4 minutes for no additional safety.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Verify Cargo.toml version matches the tag ─────────────────────────────
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check tag is on main and matches Cargo.toml version
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not reachable from main"
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"          # e.g. v0.1.0
          CRATE_VER="v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          echo "Tag:   $TAG"
          echo "Crate: $CRATE_VER"
          if [ "$TAG" != "$CRATE_VER" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $CRATE_VER"
            exit 1
          fi

  # ── 2. Publish to crates.io ──────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-version]
    environment: crates-io

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check if version already published
        id: check_published
        shell: bash
        run: |
          CRATE_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          CRATE_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VER}")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${CRATE_VER} is already on crates.io — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo publish
        if: steps.check_published.outputs.already_published == 'false'
        run: |
          OUTPUT=$(cargo publish --locked 2>&1) && echo "$OUTPUT" || {
            echo "$OUTPUT"
            echo "$OUTPUT" | grep -q "already exists" && exit 0 || exit 1
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── 3. Create GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify-version, publish]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Create GitHub Release with generated notes if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Publishing existing draft release $TAG as Latest."
              gh release edit "$TAG" --draft=false --latest --title "$TAG"
            else
              echo "GitHub Release $TAG is already published; nothing to do."
            fi
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --latest
          fi
