name: Release

# Triggered by a semver tag pushed to origin.
# Tags must be created by the release-prep workflow (or manually) and follow
# the pattern v<major>.<minor>.<patch> (e.g. v0.1.0, v1.2.3).
#
# What this workflow does:
#   1. Runs the full CI suite (same gates as ci.yml) to guard against a bad tag.
#   2. Publishes the crate to crates.io.
#   3. Creates a GitHub Release with the changelog section for this version.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  # ── 1. Full CI gate ──────────────────────────────────────────────────────────
  # Re-run the same checks as ci.yml so a bad tag cannot slip through.
  ci:
    name: CI gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (dev)
        run: cargo test --all-features

      - name: cargo test (release)
        run: cargo test --release --all-features

      - name: cargo doc (no-deps)
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: '-D warnings'

  # ── 2. MSRV check ────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (Rust 1.80)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.80
        uses: dtolnay/rust-toolchain@1.80

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check (MSRV)
        run: cargo check --all-features

  # ── 3. Verify Cargo.toml version matches the tag ─────────────────────────────
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Cargo.toml version matches tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.1.0
          CRATE_VER="v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          echo "Tag:   $TAG"
          echo "Crate: $CRATE_VER"
          if [ "$TAG" != "$CRATE_VER" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $CRATE_VER"
            exit 1
          fi

  # ── 4. Publish to crates.io ──────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [ci, msrv, verify-version]
    environment: crates-io   # optional: gate behind a GitHub environment for approval

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check if version already published
        id: check_published
        shell: bash
        run: |
          CRATE_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          CRATE_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VER}")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${CRATE_VER} is already on crates.io — skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo publish
        if: steps.check_published.outputs.already_published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── 5. Create GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [ci, msrv, verify-version]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Create GitHub Release with generated notes if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
